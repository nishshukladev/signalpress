[project]
name = "signalpress"
version = "0.1.0"
description = "Config-driven, stateful newsletter agent: deterministic fetchers -> LLM judgment -> SQLite -> rendered digests, with output evals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[anthropic,openai,google]>=1.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "feedparser>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.21",
]

[project.scripts]
signalpress = "signalpress.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalpress"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
